<!doctype html>
<!-- Gives the user a tiny way to summon or dismiss the haunting and open its settings. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ghostwriter</title>
    <style>
      :root { color-scheme: light; font-family: ui-rounded, "Avenir Next", system-ui, sans-serif; color: #153d47; background: #eafaff; }
      body { width: 250px; margin: 0; padding: 16px; background: linear-gradient(155deg, #f5fdff, #e5f8fc); }
      h1 { margin: 0 0 5px; color: #075b70; font-size: 16px; }
      p { color: #537783; font-size: 11px; line-height: 1.4; }
      button { width: 100%; min-height: 38px; border: 1px solid transparent; border-radius: 8px; font: inherit; font-size: 12px; font-weight: 750; cursor: pointer; transition: background-color 140ms ease, border-color 140ms ease; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      #connect { margin-top: 9px; border-color: #b7eaf2; background: #d9f6fb; color: #075b70; }
      #connect:hover:not(:disabled) { background: #c8eff6; }
      #toggle { margin-top: 9px; background: #0798ad; color: #fff; }
      #toggle:hover:not(:disabled) { background: #087c91; }
      #trick { margin-top: 8px; background: #164b59; color: #fff; }
      #trick:hover:not(:disabled) { background: #103c48; }
      #status { min-height: 16px; margin-bottom: 0; color: #356a78; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <h1>Ghostwriter</h1>
    <p>Writing editor. Recently deceased.</p>
    <button id="connect" type="button">Connect Google Docs</button>
    <button id="toggle" type="button">Summoning…</button>
    <button id="trick" type="button" disabled>Start continuous flight</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
